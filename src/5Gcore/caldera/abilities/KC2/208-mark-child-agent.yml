      sh:
        command: PREV='#{kc2.207.done}'; if [ "${KC_AGENT_ROLE:-}" = "child" ]; then echo child; fi
        timeout: 60
        parsers:
          plugins.stockpile.app.parsers.basic:
          - source: host.kc2.child
        cleanup: ''
