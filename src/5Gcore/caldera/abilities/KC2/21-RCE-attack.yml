- id: 20000000-0000-0000-0000-000000000001
  name: Server SMTP vulnerable RCE
  description: Server vulnerable to RCE with which is open a SSH shell to the attacker.
  tactic: initial-access
  technique: { attack_id: T1190, name: "Exploit Public-Facing Application" }
  repeatable: false
  singleton: true
  platforms:
    linux:
      sh:
        command: >-
          ENTRY='#{host.kc2.entry}';
          mkdir -p "$DATA_PATH/KC2";
          KC_DATA_SUBDIR=KC2 KC_RCE_PORT="${PCF_TEST_SERVICE_PORT:-2525}"
          /opt/caldera/KC4/rce-attack.sh > "$DATA_PATH/KC2/rce-attack.log" 2>&1
          && test -s "$DATA_PATH/KC2/attackaddr"
          && echo kc2-21-done
        timeout: 900
        parsers:
          plugins.stockpile.app.parsers.basic:
            - source: kc2.21.done
        cleanup: ""
  requirements:
    - plugins.stockpile.app.requirements.paw_provenance:
      - source: host.kc2.entry
