- id: 20000000-0000-0000-0000-000000000210
  name: KC2-210 - Container admin execution
  description: Using container administrator commands from the child pod to obtain DB information.
  tactic: execution
  technique:
    attack_id: T1609
    name: Container Administration Command
  repeatable: false
  singleton: true
  platforms:
    linux:
      sh:
        command: CHILD='#{host.kc2.child}'; PREV='#{kc2.209.done}'; mkdir -p "$DATA_PATH/KC2"; OUTDIR="$DATA_PATH/KC2/dbs"
          /opt/caldera/KC4/container-admin-5gcore.sh configure-crictl > "$DATA_PATH/KC2/container-admin.log" 2>&1 && echo kc2-210-done
        timeout: 900
        parsers:
          plugins.stockpile.app.parsers.basic:
          - source: kc2.210.done
        cleanup: ''
  requirements:
  - plugins.stockpile.app.requirements.paw_provenance:
    - source: host.kc2.child
