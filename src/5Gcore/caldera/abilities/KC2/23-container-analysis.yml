- id: 20000000-0000-0000-0000-000000000003
  name: Container analysis
  description: Container analysis of everything useful inside the PCF container before the patch attack.
  tactic: discovery
  technique: { attack_id: T1613, name: "Container and Resource Discovery" }
  repeatable: false
  singleton: true
  platforms:
    linux:
      sh:
        command: >-
          ENTRY='#{host.kc2.entry}';
          PREV='#{kc2.22.done}';
          mkdir -p "$DATA_PATH/KC2";
          TARGET_FILE="$DATA_PATH/KC2/attackaddr";
          {
          test -s "$TARGET_FILE" || { echo "Missing KC2 attack address: $TARGET_FILE. Run step 21 and inspect $DATA_PATH/KC2/rce-attack.log."; exit 1; };
          TARGET="$(cat "$TARGET_FILE")";
          ssh -p 4222 -o StrictHostKeyChecking=no root@"$TARGET" 'bash -s' < /opt/caldera/KC4/container-analysis.sh;
          } > "$DATA_PATH/KC2/container-analysis.log" 2>&1
          && echo kc2-23-done
        timeout: 1800
        parsers:
          plugins.stockpile.app.parsers.basic:
            - source: kc2.23.done
        cleanup: ""
  requirements:
    - plugins.stockpile.app.requirements.paw_provenance:
      - source: host.kc2.entry
