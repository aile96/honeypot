- id: 20000000-0000-0000-0000-000000000005
  name: Data collection from containers
  description: Using container administrator commands from the child pod to collect data from containers.
  tactic: collection
  technique: { attack_id: T1005, name: "Data from Local System" }
  repeatable: false
  singleton: true
  platforms:
    linux:
      sh:
        command: >-
          CHILD='#{host.kc2.child}';
          PREV='#{kc2.24.done}';
          mkdir -p "$DATA_PATH/KC2";
          /opt/caldera/KC4/container-collection.sh configure-crictl > "$DATA_PATH/KC2/cri-analysis.log" 2>&1;
          echo kc2-25-done
        timeout: 900
        parsers:
          plugins.stockpile.app.parsers.basic:
            - source: kc2.25.done
        cleanup: ""
  requirements:
    - plugins.stockpile.app.requirements.paw_provenance:
      - source: host.kc2.child
