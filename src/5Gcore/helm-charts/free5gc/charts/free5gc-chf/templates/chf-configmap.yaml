#
# Software Name : free5gc-helm
#
{{- with .Values.chf }}
apiVersion: v1
kind: ConfigMap
metadata:
  name:  {{ include "free5gc-chf.fullname" $ }}-configmap
  labels:
    app: {{ $.Values.global.projectName }}
data:
  chfcfg.yaml: |
    info:
      version: 1.0.3
      description: CHF initial local configuration

    configuration:
      chfName: CHF # the name of this CHF
      sbi: # Service-based interface information
        scheme: {{ $.Values.global.sbi.scheme }} # the protocol for sbi (http or https)
        registerIPv4: {{ include "free5gc-chf.fullname" $ }}-service # IP used to register to NRF
        bindingIPv4: 0.0.0.0 # IP used to bind the service
        port: {{ .service.port }} # port used to bind the service
        tls: # the local path of TLS key
          pem: ./cert/chf.pem # CHF TLS Certificate
          key: ./cert/chf.key # CHF TLS Private key
{{- if $.Values.chf.configuration.metrics.enable }}
      metrics: 
        enable: true
        scheme: {{ $.Values.chf.configuration.metrics.scheme }}
        bindingIPv4: 0.0.0.0  # IP used to bind the service
        port: {{ $.Values.chf.configuration.metrics.port }}
        namespace: {{ $.Values.chf.configuration.metrics.namespace }}
        tls:
          key: ./cert/chf.key
          pem: ./cert/chf.pem
{{- end }}

      nrfUri: {{ $.Values.global.sbi.scheme }}://{{ $.Values.global.nrf.service.name }}:{{ $.Values.global.nrf.service.port }} # a valid URI of NRF
      nrfCertPem: {{ ternary "./oauth/nrf.pem" "./nrf-cert/nrf.pem" $.Values.global.oauth.samba.enabled }} # NRF Certificate
      serviceNameList: # the SBI services provided by this CHF, refer to TS 32.291
        {{- .configuration.serviceNameList | nindent 8 }}
      mongodb: # the mongodb connected by this CHF
        name: free5gc # name of the mongodb
        url: MONGODB_URL_PLACEHOLDER # a valid URL of the mongodb; populated at runtime from Secret
      
      quotaValidityTime: 10000
      volumeLimit: 50000
      volumeLimitPDU: 10000
      volumeThresholdRate: 0.8

      cgf:
        enable: true
        hostIPv4: {{ $.Values.global.webui.service.name }}
        port: {{ $.Values.global.webui.service.port }}
        listenPort: {{ $.Values.global.cgf.service.port }}
        passiveTransferPortRange:
          start: 2123
          end: 2130
        tls:
          pem: ./cert/chf.pem
          key: ./cert/chf.key
        cdrFilePath: /tmp
      abmfDiameter:
        protocol: tcp
        hostIPv4: 0.0.0.0
        port: 3868
        tls:
          pem: ./cert/chf.pem
          key: ./cert/chf.key
      rfDiameter:
        protocol: tcp
        hostIPv4: 0.0.0.0
        port: 3869
        tls:
          pem: ./cert/chf.pem # CHF TLS Certificate
          key: ./cert/chf.key # CHF TLS Private key

    logger: # log output setting
      {{- toYaml .configuration.logger | nindent 6 }}


  mongodb-uri-wrapper.sh: |
    #!/bin/sh
    set -eu

    # Build the authenticated MongoDB URI at runtime from a Kubernetes Secret.
    # free5GC requires the MongoDB URL inside its YAML config, so this wrapper
    # writes a temporary config file and keeps Secret data out of ConfigMaps.
    config_src="$1"
    config_dst="$2"
    shift 2

    : "${MONGODB_URL:?MONGODB_URL must be set from the MongoDB app Secret}"
    mkdir -p "$(dirname "$config_dst")"
    cp "$config_src" "$config_dst"

    escaped_uri=$(printf '%s' "$MONGODB_URL" | sed 's/[\/&]/\\&/g')
    sed -i "s/MONGODB_URL_PLACEHOLDER/${escaped_uri}/g" "$config_dst"

    exec "$@"

{{- end }}
