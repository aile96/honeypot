{{- with .Values.nrf }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "free5gc-nrf.fullname" $ }}-configmap
  labels:
    app: {{ $.Values.global.projectName }}
data:
  nrfcfg.yaml: |
    info:
      version: 1.0.2
      description: NRF initial local configuration

    configuration:
      MongoDBName: free5gc
      MongoDBUrl: MONGODB_URL_PLACEHOLDER

      serviceNameList:
        {{- .configuration.serviceNameList | nindent 8 }}

      sbi:
        scheme: {{ $.Values.global.sbi.scheme }}
        registerIPv4: {{ $.Values.global.nrf.service.name }} # IP used to serve NFs or register to another NRF
        bindingIPv4: 0.0.0.0  # IP used to bind the service
        port: {{ $.Values.global.nrf.service.port }}
        cert:
          key: ./cert/nrf.key
          pem: ./cert/nrf.pem
        rootcert: # the local path of root CA certs
          pem: cert/nrf.pem
          key: cert/nrf.key
        oauth: {{ $.Values.global.oauth.enabled | default false }}
{{- if $.Values.nrf.configuration.metrics.enable }}
      metrics: 
        enable: true
        scheme: {{ $.Values.nrf.configuration.metrics.scheme }}
        bindingIPv4: 0.0.0.0  # IP used to bind the service
        port: {{ $.Values.nrf.configuration.metrics.port }}
        namespace: {{ $.Values.nrf.configuration.metrics.namespace }}
        tls:
          key: ./cert/nrf.key
          pem: ./cert/nrf.pem
{{- end }}

      {{- .configuration.configuration | nindent 6 }}

    logger:
      {{- toYaml .configuration.logger | nindent 6 }}


  mongodb-uri-wrapper.sh: |
    #!/bin/sh
    set -eu

    # Build the authenticated MongoDB URI at runtime from a Kubernetes Secret.
    # free5GC requires the MongoDB URL inside its YAML config, so this wrapper
    # writes a temporary config file and keeps Secret data out of ConfigMaps.
    config_src="$1"
    config_dst="$2"
    shift 2

    : "${MONGODB_URL:?MONGODB_URL must be set from the MongoDB app Secret}"
    mkdir -p "$(dirname "$config_dst")"
    cp "$config_src" "$config_dst"

    escaped_uri=$(printf '%s' "$MONGODB_URL" | sed 's/[\/&]/\\&/g')
    sed -i "s/MONGODB_URL_PLACEHOLDER/${escaped_uri}/g" "$config_dst"

    exec "$@"

{{- end }}
