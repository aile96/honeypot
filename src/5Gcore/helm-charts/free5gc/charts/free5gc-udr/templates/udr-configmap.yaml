{{- with .Values.udr }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "free5gc-udr.fullname" $ }}-configmap
  labels:
    app: {{ $.Values.global.projectName }}
data:
  udrcfg.yaml: |
    info:
      version: 1.1.0
      description: UDR initial local configuration

    configuration:
      sbi:
        scheme: {{ $.Values.global.sbi.scheme }}
        registerIPv4: {{ include "free5gc-udr.fullname" $ }}-service # IP used to register to NRF
        bindingIPv4: 0.0.0.0  # IP used to bind the service
        port: {{ .service.port }}
        tls:
          key: ./cert/udr.key
          pem: ./cert/udr.pem
{{- if $.Values.udr.configuration.metrics.enable }}
      metrics: 
        enable: true
        scheme: {{ $.Values.udr.configuration.metrics.scheme }}
        bindingIPv4: 0.0.0.0  # IP used to bind the service
        port: {{ $.Values.udr.configuration.metrics.port }}
        namespace: {{ $.Values.udr.configuration.metrics.namespace }}
        tls:
          key: ./cert/udr.key
          pem: ./cert/udr.pem
{{- end }}

      dbConnectorType: mongodb
      mongodb:
        name: free5gc
        url: MONGODB_URL_PLACEHOLDER

      nrfUri: {{ $.Values.global.sbi.scheme }}://{{ $.Values.global.nrf.service.name }}:{{ $.Values.global.nrf.service.port }}
      nrfCertPem: {{ ternary "oauth/nrf.pem" "cert/nrf.pem" $.Values.global.oauth.samba.enabled }}

    logger:
      {{- toYaml .configuration.logger | nindent 6 }}


  mongodb-uri-wrapper.sh: |
    #!/bin/sh
    set -eu

    # Build the authenticated MongoDB URI at runtime from a Kubernetes Secret.
    # free5GC requires the MongoDB URL inside its YAML config, so this wrapper
    # writes a temporary config file and keeps Secret data out of ConfigMaps.
    config_src="$1"
    config_dst="$2"
    shift 2

    : "${MONGODB_URL:?MONGODB_URL must be set from the MongoDB app Secret}"
    mkdir -p "$(dirname "$config_dst")"
    cp "$config_src" "$config_dst"

    escaped_uri=$(printf '%s' "$MONGODB_URL" | sed 's/[\/&]/\\&/g')
    sed -i "s/MONGODB_URL_PLACEHOLDER/${escaped_uri}/g" "$config_dst"

    exec "$@"

{{- end }}
