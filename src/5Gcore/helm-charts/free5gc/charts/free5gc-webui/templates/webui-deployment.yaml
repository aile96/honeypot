{{- with .Values.webui }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "free5gc-webui.fullname" $ }}-{{ .name }}
  labels:
    {{- include "free5gc-webui.labels" $ | nindent 4 }}
    project: {{ $.Values.global.projectName }}
    nf: {{ .name }}
spec:
  {{- if not .autoscaling.enabled }}
  replicas: {{ .replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "free5gc-webui.selectorLabels" $ | nindent 6 }}
      project: {{ $.Values.global.projectName }}
      nf: {{ .name }}
  template:
    metadata:
      annotations:
        {{- include "free5gc-webui.webuiAnnotations" $ | nindent 8 }}
        checksum/config: {{ include (print $.Template.BasePath "/webui-configmap.yaml") $ | sha256sum }}    
      labels:

        honeypot.lab/destructive-ok: "true"
        {{- include "free5gc-webui.selectorLabels" $ | nindent 8 }}
        project: {{ $.Values.global.projectName }}
        nf: {{ .name }}
    spec:
      imagePullSecrets:
        {{- toYaml .imagePullSecrets | nindent 8 }}
      securityContext:
        {{- toYaml .podSecurityContext | nindent 8 }}
      initContainers:
      - name: wait-mongo
        {{- with $.Values.initcontainers.busybox }}
        image: {{ .image }}:{{ .tag }}
        {{- end }}
        env:
        - name: DEPENDENCIES
          {{- with $.Values.mongodb.service }}
          value: {{ .name }}:{{ .port }}
          {{- end }}
        command: ["sh", "-c", "host=${DEPENDENCIES%:*}; port=${DEPENDENCIES##*:}; until nc -z -w 2 \"$host\" \"$port\"; do echo waiting for the MongoDB; sleep 2; done;"]
      containers:
      - name: {{ .name }}
        image: {{ .image.name }}:{{ .image.tag | default $.Chart.AppVersion }}
        imagePullPolicy: {{ .image.pullPolicy }}
        securityContext:
            {{- toYaml .securityContext | nindent 12 }}
        ports:
        - containerPort: {{ .service.port }}
        - containerPort: {{ $.Values.global.webui.service.port }}
        command:
          - "/sbin/tini"
          - "--"
          - "/bin/sh"
          - "./config/mongodb-uri-wrapper.sh"
          - "./config/webuicfg.yaml"
          - "/tmp/free5gc-config/webuicfg.yaml"
          - "./webui"
        args:
          - "-c"
          - "/tmp/free5gc-config/webuicfg.yaml"
        env:
          # MongoDB credentials are read from Secret and injected into a runtime config copy.
          - name: MONGODB_URL
            valueFrom:
              secretKeyRef:
                name: {{ dig "mongodb" "auth" "appSecretName" "free5gc-mongodb-app" $.Values.global }}
                key: url
          - name: GIN_MODE
            value: release
        volumeMounts:
        - mountPath: {{ .volume.mount }}
          name: {{ .volume.name }}
        - mountPath: {{ .volume.tlsmount }}
          name: {{ .volume.name }}-empty
        - mountPath: {{ .volume.certmount }}
          name: {{ include "free5gc-webui.fullname" $ }}-cert-volume
        {{- if $.Values.global.oauth.samba.enabled }}
        - mountPath: /free5gc/oauth
          name: free5gc-oauth-dir
        - mountPath: /free5gc/oauth/nrf.pem
          name: free5gc-oauth-smb-volume
          subPath: {{ $.Values.global.oauth.samba.sharePath }}/nrf.pem
          readOnly: true
        {{- end }}
        resources:
            {{- toYaml .resources | nindent 12 }}
        readinessProbe:
          initialDelaySeconds: {{ .readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .readinessProbe.timeoutSeconds }}
          failureThreshold:  {{ .readinessProbe.failureThreshold }}
          successThreshold: {{ .readinessProbe.successThreshold }}
          httpGet:
            scheme: HTTP
            port: {{ .service.port }}
        livenessProbe:
          initialDelaySeconds: {{ .livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .livenessProbe.failureThreshold }}
          successThreshold: {{ .livenessProbe.successThreshold }}
          httpGet:
            scheme: HTTP
            port: {{ .service.port }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      nodeSelector:
        {{- toYaml .nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .affinity | nindent 8 }}
      tolerations:
        {{- toYaml .tolerations | nindent 8 }}

      volumes:
      - name: {{ .volume.name }}
        projected:
          sources:
          - configMap:
              name: {{ .configmap.name }}
      - name: {{ .volume.name }}-empty
        emptyDir: {}
      - name: {{ include "free5gc-webui.fullname" $ }}-cert-volume
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: {{ printf "%s-chf-tls-secret" $.Release.Name }}
              items:
                - key: chf.pem
                  path: chf.pem
                - key: chf.key
                  path: chf.key
          - configMap:
              name: free5gc-public-certs
              items:
                - key: nrf.pem
                  path: nrf.pem
      {{- if $.Values.global.oauth.samba.enabled }}
      - name: free5gc-oauth-dir
        emptyDir: {}
      - name: free5gc-oauth-smb-volume
        persistentVolumeClaim:
          claimName: {{ $.Values.global.oauth.samba.pvcName }}
          readOnly: true
      {{- end }}
{{- end }}
