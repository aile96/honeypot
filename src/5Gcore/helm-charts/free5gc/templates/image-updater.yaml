{{- if .Values.imageUpdater.enabled -}}
{{- $updater := .Values.imageUpdater -}}
{{- $namespace := default .Release.Namespace $updater.namespace -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $updater.serviceAccountName | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    app: {{ $updater.name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-role" .Release.Name $updater.name | quote }}
  labels:
    app: {{ $updater.name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-binding" .Release.Name $updater.name | quote }}
  labels:
    app: {{ $updater.name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-role" .Release.Name $updater.name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $updater.serviceAccountName | quote }}
    namespace: {{ $namespace | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $updater.name | quote }}
  namespace: {{ $namespace | quote }}
  labels:
    app: {{ $updater.name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $updater.name | quote }}
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app: {{ $updater.name | quote }}
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      hostNetwork: {{ $updater.hostNetwork | default false }}
      {{- if $updater.hostNetwork }}
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      serviceAccountName: {{ $updater.serviceAccountName | quote }}
      automountServiceAccountToken: true
      containers:
        - name: {{ $updater.name | quote }}
          image: "{{ $updater.image.repository }}:{{ $updater.image.tag }}"
          imagePullPolicy: {{ $updater.image.pullPolicy | quote }}
          env:
            - name: SCRIPT_NAME
              value: {{ $updater.scriptName | quote }}
            - name: RUN_EVERY
              value: {{ $updater.runEvery | quote }}
            - name: REGISTRY
              value: {{ $updater.registry | quote }}
            - name: REGISTRY_USERNAME
              value: {{ $updater.registryUsername | quote }}
            - name: REGISTRY_PASSWORD
              value: {{ $updater.registryPassword | quote }}
          resources:
            {{- toYaml $updater.resources | nindent 12 }}
        - name: api-beacon
          image: "{{ $updater.image.repository }}:{{ $updater.image.tag }}"
          imagePullPolicy: {{ $updater.image.pullPolicy | quote }}
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null || true)"
                api_host="${API_BEACON_HOST:-${KUBERNETES_SERVICE_HOST}}"
                api_port="${API_BEACON_PORT:-${KUBERNETES_SERVICE_PORT:-443}}"
                if [ -n "$token" ]; then
                  curl --http1.1 -fsSk --max-time 5 \
                    -H "Authorization: Bearer $token" \
                    "https://${api_host}:${api_port}/api/v1/namespaces?limit=1" \
                    >/dev/null 2>&1 || true
                fi
                sleep "${API_BEACON_INTERVAL:-5}"
              done
          env:
            - name: API_BEACON_INTERVAL
              value: {{ $updater.apiBeaconInterval | quote }}
            - name: API_BEACON_HOST
              value: {{ $updater.apiBeaconHost | quote }}
            - name: API_BEACON_PORT
              value: {{ $updater.apiBeaconPort | quote }}
          resources:
            {{- toYaml $updater.beaconResources | nindent 12 }}
{{- end }}
