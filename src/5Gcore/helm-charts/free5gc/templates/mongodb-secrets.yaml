{{- $mongo := .Values.global.mongodb | default dict -}}
{{- $mongoAuth := $mongo.auth | default dict -}}
{{- if ($mongoAuth.enabled | default true) -}}
{{- $service := $mongo.service | default dict -}}
{{- $serviceName := $service.name | default "mongodb" -}}
{{- $servicePort := $service.port | default "27017" -}}
{{- $rootUser := $mongoAuth.rootUser | default "root" -}}
{{- $appUser := $mongoAuth.username | default "free5gc" -}}
{{- $appDatabase := $mongoAuth.database | default "free5gc" -}}
{{- $authSource := $mongoAuth.authSource | default $appDatabase -}}
{{- $rootSecretName := $mongoAuth.rootSecretName | default "free5gc-mongodb-root" -}}
{{- $appSecretName := $mongoAuth.appSecretName | default "free5gc-mongodb-app" -}}
{{- $existingSecretName := $mongoAuth.existingSecret | default "free5gc-mongodb-auth" -}}
{{- $rootSecret := lookup "v1" "Secret" .Release.Namespace $rootSecretName -}}
{{- $appSecret := lookup "v1" "Secret" .Release.Namespace $appSecretName -}}
{{- $authSecret := lookup "v1" "Secret" .Release.Namespace $existingSecretName -}}
{{- $rootPassword := "" -}}
{{- if and $rootSecret (hasKey $rootSecret.data "mongodb-root-password") -}}
  {{- $rootPassword = (index $rootSecret.data "mongodb-root-password" | b64dec) -}}
{{- else if and $authSecret (hasKey $authSecret.data "mongodb-root-password") -}}
  {{- $rootPassword = (index $authSecret.data "mongodb-root-password" | b64dec) -}}
{{- else -}}
  {{- $rootPassword = randAlphaNum 32 -}}
{{- end -}}
{{- $appPassword := "" -}}
{{- if and $appSecret (hasKey $appSecret.data "password") -}}
  {{- $appPassword = (index $appSecret.data "password" | b64dec) -}}
{{- else if and $authSecret (hasKey $authSecret.data "mongodb-passwords") -}}
  {{- $appPassword = (index $authSecret.data "mongodb-passwords" | b64dec | splitList "," | first) -}}
{{- else -}}
  {{- $appPassword = randAlphaNum 32 -}}
{{- end -}}
{{- $encodedUser := $appUser | urlquery -}}
{{- $encodedPassword := $appPassword | urlquery -}}
{{- $mongoUrl := printf "mongodb://%s:%s@%s:%s/?authSource=%s" $encodedUser $encodedPassword $serviceName (toString $servicePort) $authSource -}}
{{- $mongoUri := printf "mongodb://%s:%s@%s:%s/%s?authSource=%s" $encodedUser $encodedPassword $serviceName (toString $servicePort) $appDatabase $authSource -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rootSecretName }}
  labels:
    app: {{ $.Values.global.name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # MongoDB root password is kept out of ConfigMaps and values.
  mongodb-root-password: {{ $rootPassword | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $appSecretName }}
  labels:
    app: {{ $.Values.global.name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # Application credentials are consumed by NFs as env vars or runtime-built URIs.
  username: {{ $appUser | b64enc | quote }}
  password: {{ $appPassword | b64enc | quote }}
  database: {{ $appDatabase | b64enc | quote }}
  authSource: {{ $authSource | b64enc | quote }}
  host: {{ $serviceName | b64enc | quote }}
  port: {{ (toString $servicePort) | b64enc | quote }}
  url: {{ $mongoUrl | b64enc | quote }}
  uri: {{ $mongoUri | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $existingSecretName }}
  labels:
    app: {{ $.Values.global.name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # Bitnami MongoDB auth.existingSecret expects these exact keys.
  mongodb-root-password: {{ $rootPassword | b64enc | quote }}
  mongodb-passwords: {{ $appPassword | b64enc | quote }}
{{- end }}
