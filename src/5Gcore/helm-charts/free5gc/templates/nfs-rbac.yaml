apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfs
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nfs
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list
      - patch
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
      - patch
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfs
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: nfs
    namespace: {{ .Release.Namespace }}
  # Keep existing NFs that still use the default ServiceAccount inside the same RBAC boundary.
  - kind: ServiceAccount
    name: default
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nfs
