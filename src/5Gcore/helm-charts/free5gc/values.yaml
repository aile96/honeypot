#
# Default values for free5gc-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  name: free5gc
  userPlaneArchitecture: ulcl  # possible values are "single" and "ulcl"
  uesubnet: 10.60.0.0/16  # UE IP address pool
  nrf:
    service:
      name: nrf-nnrf
      type: ClusterIP
      port: "8000"
      nodePort: "30800"
  nwdaf:
    service:
      name: nwdaf-nnwdaf
      type: ClusterIP
      port: 8080
  sbi:
    scheme: https
  oauth:
    enabled: true
    samba:
      enabled: true
      serviceName: samba-pv
      source: "//samba-pv/pvroot"
      pvcName: free5gc-oauth-smb-pvc
      pvName: free5gc-oauth-smb-pv
      secretName: free5gc-smb-creds
      sharePath: oauth
      username: k8s
      password: password
      uid: "10001"
      gid: "10001"

  mongodb:
    service:
      name: mongodb
      port: "27017"
    auth:
      enabled: true
      # Kubernetes Secrets hold MongoDB credentials. Passwords are generated
      # on first install/upgrade when the Secret does not already exist.
      rootSecretName: free5gc-mongodb-root
      appSecretName: free5gc-mongodb-app
      existingSecret: free5gc-mongodb-auth
      rootUser: root
      username: free5gc
      database: free5gc
      authSource: free5gc
    migration:
      # The pre-upgrade hook creates MongoDB users before auth is enabled, so
      # existing PVC data is preserved instead of reinitializing the database.
      enabled: true
      activeDeadlineSeconds: 300
  
  # AMF Multus CNI Configuration
  amf:
    multus:
      enabled: false  # Default: disabled for cloud-native deployments
      n2if:  # NGAP interface (used when multus.enabled=true)
        ipAddress: 10.100.50.249
      n2network:
        enabled: true
        name: n2network
        type: ipvlan
        masterIf: eth0
        subnetIP: 10.100.50.248
        cidr: 29
        gatewayIP: 10.100.50.254
        excludeIP: 10.100.50.254
    service:
      ngap:
        enabled: true  # Enable NGAP service for external access
        name: amf-n2
        port: 38412
        nodeport: 31412
        protocol: SCTP
        type: NodePort
  
  # SMF Multus CNI Configuration
  smf:
    multus:
      enabled: false  # Default: disabled for cloud-native deployments
      n4if:  # PFCP interface (used when multus.enabled=true)
        ipAddress: 10.100.50.244
      n4network:
        enabled: true
        name: n4network
        type: ipvlan
        masterIf: eth0
        subnetIP: 10.100.50.240
        cidr: 29
        gatewayIP: 10.100.50.246
        excludeIP: 10.100.50.246
  
  # UPF Multus CNI Configuration
  upf:
    multus:
      enabled: false  # Default: disabled for cloud-native deployments
      # Static IP configurations for UPF instances (used when multus.enabled=true)
      upf:
        n3if:
          ipAddress: 10.100.50.233
        n4if:
          ipAddress: 10.100.50.241
        n6if:
          ipAddress: 10.100.100.11
      psaupf1:
        n4if:
          ipAddress: 10.100.50.242
        n6if:
          ipAddress: 10.100.100.12
        n9if:
          ipAddress: 10.100.50.225
      psaupf2:
        n4if:
          ipAddress: 10.100.50.243
        n6if:
          ipAddress: 10.100.100.13
        n9if:
          ipAddress: 10.100.50.226
      iupf1:
        n3if:
          ipAddress: 10.100.50.234
        n4if:
          ipAddress: 10.100.50.245
        n6if:
          ipAddress: 10.100.100.14
        n9if:
          ipAddress: 10.100.50.227
      n3network:
        enabled: true
        name: n3network
        type: ipvlan
        masterIf: eth0
        subnetIP: 10.100.50.232
        cidr: 29
        gatewayIP: 10.100.50.238
        excludeIP: 10.100.50.238
      n4network:
        enabled: true
        name: n4network
        type: ipvlan
        masterIf: eth0
        subnetIP: 10.100.50.240
        cidr: 29
        gatewayIP: 10.100.50.246
        excludeIP: 10.100.50.246
      n6network:
        enabled: true
        name: n6network
        type: ipvlan
        masterIf: eth1
        subnetIP: 10.100.100.0
        cidr: 24
        gatewayIP: 10.100.100.1
        excludeIP: 10.100.100.254
      n9network:
        enabled: true
        name: n9network
        type: ipvlan
        masterIf: eth0
        subnetIP: 10.100.50.224
        cidr: 29
        gatewayIP: 10.100.50.230
        excludeIP: 10.100.50.230

imageUpdater:
  enabled: false
  name: image-updater
  namespace: kube-system
  serviceAccountName: updater-sa
  image:
    repository: registry:5000/controller
    tag: "2.0.2"
    pullPolicy: IfNotPresent
  registry: registry:5000
  registryUsername: imageuser
  registryPassword: SuperPassW1!
  scriptName: update-images.sh
  runEvery: 1m
  resources:
    limits:
      memory: 200Mi


# These parameters can be used to enable/disable deployment of subcharts
deployMongoDb: true
deployAmf: true
deployAusf: true
deployChf: true
deployN3iwf: false
deployNef: true
deployNrf: true
deployNssf: true
deployNwdaf: true
deployPcf: true
deploySmf: true
deployUdm: true
deployUdr: true
deployUpf: true
deployWebui: true
deployDbPython: false

# Disable the deployment of mongodb as an NRF subchart
free5gc-nrf:
  db:
    enabled: false

# This section can be used to override the default values in the MongoDB chart
mongodb:
  fullnameOverride: "mongodb"
  useStatefulSet: true
  auth:
    enabled: true
    rootUser: root
    existingSecret: free5gc-mongodb-auth
    usernames:
      - free5gc
    databases:
      - free5gc
  persistence:
    size: 6Gi
    mountPath: /bitnami/mongodb/data/db/
  service:
    name: mongodb
    type: ClusterIP
    port: 27017
    nodePort: "30017"
