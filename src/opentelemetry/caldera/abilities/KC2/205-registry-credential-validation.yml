- id: 20000000-0000-0000-0000-000000000205
  name: KC2-205 - Registry credential validation marker
  description: Separate marker for validating guessed registry credentials before modifying the checkout image.
  tactic: credential-access
  technique:
    attack_id: T1110.001
    name: Password Guessing
  repeatable: false
  singleton: true
  platforms:
    linux:
      sh:
        command: |
          set -e;
          test -s "$DATA_PATH/KC2/user";
          test -s "$DATA_PATH/KC2/pass";
          echo otel-kc2-205-registry-credential-validation
        timeout: 60
        parsers: []
        cleanup: ''
